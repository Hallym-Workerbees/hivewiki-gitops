deploymentMode: Monolithic

loki:
  auth_enabled: false

  image:
    registry: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com
    repository: docker-hub/grafana/loki
    pullPolicy: IfNotPresent

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage_config:
    aws:
      region: "<S3_BUCKET_REGION>"
      bucketnames: "<LOKI_CHUNKS_BUCKET_NAME>"
      s3forcepathstyle: false

  storage:
    type: s3
    bucketNames:
      chunks: "<LOKI_CHUNKS_BUCKET_NAME>"
      ruler: "<LOKI_RULER_BUCKET_NAME>"
    s3:
      region: "<S3_BUCKET_REGION>"
      s3ForcePathStyle: false

  commonConfig:
    replication_factor: 1

  ingester:
    chunk_encoding: snappy

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h

  compactor:
    retention_enabled: true
    delete_request_store: s3

  querier:
    max_concurrent: 4

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "<LOKI_SERVICE_ACCOUNT_ROLE_ARN>"

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi

gateway:
  enabled: true
  image:
    registry: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com
    repository: docker-hub/nginxinc/nginx-unprivileged
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP

lokiCanary:
  enabled: true
  image:
    registry: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com
    repository: docker-hub/grafana/loki-canary
    pullPolicy: IfNotPresent

test:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

minio:
  enabled: false
