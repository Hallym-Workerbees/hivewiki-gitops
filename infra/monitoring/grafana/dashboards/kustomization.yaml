apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: grafana-dashboard-argocd
    namespace: monitoring
    files:
      - argocd.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-k8s
    namespace: monitoring
    files:
      - k8s-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-karpenter
    namespace: monitoring
    files:
      - karpenter.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-kubernetes-logs
    namespace: monitoring
    files:
      - k8s-logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

  - name: grafana-dashboard-yace
    namespace: monitoring
    files:
      - yace.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
