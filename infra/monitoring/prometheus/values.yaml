configmapReload:
  prometheus:
    image:
      repository: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com/quay/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0
      pullPolicy: IfNotPresent

server:
  image:
    repository: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com/quay/prometheus/prometheus
    pullPolicy: IfNotPresent
  alertmanagers:
    - static_configs:
        - targets:
            - prometheus-alertmanager.monitoring.svc.cluster.local:9093
  persistentVolume:
    storageClass: gp3
  nodeSelector:
    env: shared
    workload: system

alertmanager:
  image:
    repository: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com/quay/prometheus/alertmanager
    pullPolicy: IfNotPresent
  extraSecretMounts:
    - name: alertmanager-slack-webhook
      mountPath: /etc/alertmanager/secrets/slack
      secretName: alertmanager-slack-webhook
      readOnly: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: ["alertname", "service", "env", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: slack
          matchers:
            - severity="critical"
          repeat_interval: 1h
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal: ["service", "env"]
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack/webhook-url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts -}}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Service:* {{ .Labels.service }}
              *Env:* {{ .Labels.env }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
  persistence:
    storageClass: gp3

kube-state-metrics:
  image:
    registry: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com
    repository: k8s/kube-state-metrics/kube-state-metrics
    pullPolicy: IfNotPresent

prometheus-node-exporter:
  image:
    registry: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com
    repository: quay/prometheus/node-exporter
    pullPolicy: IfNotPresent

prometheus-pushgateway:
  image:
    repository: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com/quay/prometheus/pushgateway
    pullPolicy: IfNotPresent

serverFiles:
  prometheus.yml:
    global:
      evaluation_interval: 1m
      scrape_interval: 1m
      scrape_timeout: 10s
    scrape_configs:
      - job_name: kubernetes-api-servers
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpointslice
        relabel_configs:
          - action: keep
            regex: default;kubernetes;https
            source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpointslice_port_name
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      - job_name: kubernetes-nodes
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
      - job_name: kubernetes-nodes-cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels:
              - __metrics_path__
            target_label: metrics_path
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
      - job_name: kubernetes-pods
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: keep
            regex: true
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          - action: drop
            regex: true
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
          - action: replace
            regex: (https?)
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: (.+)
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
          - action: replace
            regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
            replacement: '[$2]:$1'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_port
              - __meta_kubernetes_pod_ip
            target_label: __address__
          - action: replace
            regex: (\d+);((([0-9]+?)(\.|$)){4})
            replacement: $2:$1
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_port
              - __meta_kubernetes_pod_ip
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - action: drop
            regex: Pending|Succeeded|Failed|Completed
            source_labels:
              - __meta_kubernetes_pod_phase
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
      - job_name: kubernetes-pods-slow
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        scrape_interval: 5m
        scrape_timeout: 30s
        relabel_configs:
          - action: keep
            regex: true
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
          - action: replace
            regex: (https?)
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: (.+)
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
          - action: replace
            regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
            replacement: '[$2]:$1'
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_port
              - __meta_kubernetes_pod_ip
            target_label: __address__
          - action: replace
            regex: (\d+);((([0-9]+?)(\.|$)){4})
            replacement: $2:$1
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_port
              - __meta_kubernetes_pod_ip
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - action: drop
            regex: Pending|Succeeded|Failed|Completed
            source_labels:
              - __meta_kubernetes_pod_phase
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
      - job_name: kubernetes-service-endpoints
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpointslice
        relabel_configs:
          - action: keep
            regex: true
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scrape
          - action: drop
            regex: true
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scrape_slow
          - action: drop
            regex: kube-system;cilium-agent;9964
            source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_service_name
              - __meta_kubernetes_service_annotation_prometheus_io_port
          - action: replace
            regex: (https?)
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: (.+)
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_path
            target_label: __metrics_path__
          - action: replace
            regex: (.+?)(?::\d+)?;(\d+)
            replacement: $1:$2
            source_labels:
              - __address__
              - __meta_kubernetes_service_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_service_name
            target_label: service
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
      - job_name: kubernetes-service-endpoints-slow
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpointslice
        scrape_interval: 5m
        scrape_timeout: 30s
        relabel_configs:
          - action: keep
            regex: true
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scrape_slow
          - action: replace
            regex: (https?)
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_scheme
            target_label: __scheme__
          - action: replace
            regex: (.+)
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_path
            target_label: __metrics_path__
          - action: replace
            regex: (.+?)(?::\d+)?;(\d+)
            replacement: $1:$2
            source_labels:
              - __address__
              - __meta_kubernetes_service_annotation_prometheus_io_port
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
            replacement: __param_$1
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_service_name
            target_label: service
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
      - job_name: kubernetes-services
        honor_labels: true
        kubernetes_sd_configs:
          - role: service
        metrics_path: /probe
        params:
          module:
            - http_2xx
        relabel_configs:
          - action: keep
            regex: true
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_probe
          - source_labels:
              - __address__
            target_label: __param_target
          - replacement: blackbox
            target_label: __address__
          - source_labels:
              - __param_target
            target_label: instance
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_service_name
            target_label: service
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
      - job_name: prometheus-pushgateway
        honor_labels: true
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - action: keep
            regex: pushgateway
            source_labels:
              - __meta_kubernetes_service_annotation_prometheus_io_probe
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - prometheus-alertmanager.monitoring.svc.cluster.local:9093
  alerting_rules.yml:
    groups:
      - name: argocd.rules
        rules:
          - alert: ArgoCDAppUnhealthy
            expr: argocd_app_health_status{health_status!="Healthy"} == 1
            for: 5m
            labels:
              severity: warning
              service: argocd
              env: dev
            annotations:
              summary: ArgoCD application is unhealthy
              description: ArgoCD application {{ $labels.name }} has been in {{ $labels.health_status }} state for more than 5 minutes.

          - alert: ArgoCDAppOutOfSync
            expr: argocd_app_sync_status{sync_status!="Synced"} == 1
            for: 10m
            labels:
              severity: warning
              service: argocd
              env: dev
            annotations:
              summary: ArgoCD application is out of sync
              description: ArgoCD application {{ $labels.name }} has been in {{ $labels.sync_status }} state for more than 10 minutes.

      - name: kubernetes.rules
        rules:
          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
            for: 5m
            labels:
              severity: warning
              service: kubernetes
              env: dev
            annotations:
              summary: Pod container is crash looping
              description: Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has been in CrashLoopBackOff for more than 5 minutes.

          - alert: PodOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} > 0
            for: 5m
            labels:
              severity: warning
              service: kubernetes
              env: dev
            annotations:
              summary: Pod container was OOMKilled
              description: Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was OOMKilled and has remained reported for more than 5 minutes.

          - alert: PrometheusTargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
              service: monitoring
              env: dev
            annotations:
              summary: Prometheus scrape target is down
              description: Prometheus target {{ $labels.job }}/{{ $labels.instance }} has been down for more than 5 minutes.

          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 5m
            labels:
              severity: critical
              service: kubernetes
              env: dev
            annotations:
              summary: Kubernetes node is not ready
              description: Node {{ $labels.node }} has been NotReady for more than 5 minutes.

          - alert: PersistentVolumeUsageHigh
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes >= 0.85
            for: 10m
            labels:
              severity: warning
              service: kubernetes
              env: dev
            annotations:
              summary: Persistent volume usage is high
              description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has used at least 85% of its capacity for more than 10 minutes.

      - name: aws.rules
        rules:
          - alert: ALB5xxHigh
            expr: |
              sum by (dimension_LoadBalancer, dimension_TargetGroup, dimension_Name) (
                {__name__=~"aws_applicationelb_httpcode_(elb|target)_5_xx_count_sum"}
              )
              /
              clamp_min(
                sum by (dimension_LoadBalancer, dimension_TargetGroup, dimension_Name) (
                  aws_applicationelb_request_count_sum
                ),
                1
              ) > 0.01
              and
              sum by (dimension_LoadBalancer, dimension_TargetGroup, dimension_Name) (
                aws_applicationelb_request_count_sum
              ) > 100
            for: 5m
            labels:
              severity: warning
              service: alb
              env: dev
            annotations:
              summary: ALB 5xx error rate is high
              description: ALB {{ $labels.dimension_Name }} has a 5xx error rate above 1% with more than 100 requests per CloudWatch period for more than 5 minutes.

          - alert: ALBTargetResponseTimeP95High
            expr: aws_applicationelb_target_response_time_p95 > 0.5
            for: 5m
            labels:
              severity: warning
              service: alb
              env: dev
            annotations:
              summary: ALB target p95 response time is high
              description: ALB {{ $labels.dimension_Name }} target p95 response time has been above 0.5 seconds for more than 5 minutes.

          - alert: RDSCPUHigh
            expr: aws_rds_cpuutilization_average > 80
            for: 10m
            labels:
              severity: warning
              service: rds
              env: dev
            annotations:
              summary: RDS CPU utilization is high
              description: RDS {{ $labels.dimension_DBInstanceIdentifier }} CPU utilization has been above 80% for more than 10 minutes.

          - alert: RDSReadLatencyHigh
            expr: aws_rds_read_latency_average > 0.05
            for: 10m
            labels:
              severity: warning
              service: rds
              env: dev
            annotations:
              summary: RDS read latency is high
              description: RDS {{ $labels.dimension_DBInstanceIdentifier }} read latency has been above 0.05 seconds for more than 10 minutes.

          - alert: RDSWriteLatencyHigh
            expr: aws_rds_write_latency_average > 0.05
            for: 10m
            labels:
              severity: warning
              service: rds
              env: dev
            annotations:
              summary: RDS write latency is high
              description: RDS {{ $labels.dimension_DBInstanceIdentifier }} write latency has been above 0.05 seconds for more than 10 minutes.

      - name: hivewiki-web.rules
        rules:
          - alert: WebAppDown
            expr: hivewiki_up{job="hivewiki-web"} == 0
            for: 3m
            labels:
              severity: critical
              service: hivewiki-web
              env: dev
            annotations:
              summary: HiveWiki web app is down
              description: HiveWiki web app instance {{ $labels.instance }} has reported down for more than 3 minutes.

          - alert: WebAppHigh5xxRate
            expr: |
              (
                sum(rate(hivewiki_http_responses_total{job="hivewiki-web", status_code=~"5.."}[5m]))
                /
                clamp_min(sum(rate(hivewiki_http_responses_total{job="hivewiki-web"}[5m])), 1)
              ) > 0.01
              and
              sum(rate(hivewiki_http_responses_total{job="hivewiki-web"}[5m])) > 1
            for: 5m
            labels:
              severity: warning
              service: hivewiki-web
              env: dev
            annotations:
              summary: HiveWiki web app 5xx rate is high
              description: HiveWiki web app 5xx error rate has been above 1% with more than 1 response per second for more than 5 minutes.

          - alert: WebAppHighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(hivewiki_http_request_duration_seconds_bucket{job="hivewiki-web"}[5m])
                )
              ) > 0.5
            for: 5m
            labels:
              severity: warning
              service: hivewiki-web
              env: dev
            annotations:
              summary: HiveWiki web app p95 latency is high
              description: HiveWiki web app p95 latency has been above 500ms for more than 5 minutes.

      - name: hivewiki-collector.rules
        rules:
          - alert: CollectorScrapeDown
            expr: up{job="hivewiki-collector"} == 0
            for: 3m
            labels:
              severity: critical
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector scrape target is down
              description: HiveWiki collector target {{ $labels.instance }} has been down for more than 3 minutes.

          - alert: CollectorNoRecentSuccess
            expr: time() - collector_last_success_timestamp{job="hivewiki-collector"} > 1800
            for: 5m
            labels:
              severity: warning
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector has no recent successful run
              description: HiveWiki collector instance {{ $labels.instance }} has not reported a successful run in the last 30 minutes.

          - alert: CollectorConsecutiveFailures
            expr: collector_consecutive_failures{job="hivewiki-collector"} >= 3
            for: 5m
            labels:
              severity: critical
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector is failing consecutively
              description: HiveWiki collector instance {{ $labels.instance }} has reported at least 3 consecutive failures for more than 5 minutes.

          - alert: CollectorDispatchFailures
            expr: increase(collector_dispatch_failed_total{job="hivewiki-collector"}[10m]) > 0
            for: 5m
            labels:
              severity: warning
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector dispatch failures detected
              description: HiveWiki collector instance {{ $labels.instance }} has dispatch failures in the last 10 minutes.

          - alert: CollectorLoopErrors
            expr: increase(collector_loop_errors_total{job="hivewiki-collector"}[10m]) > 0
            for: 5m
            labels:
              severity: warning
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector loop errors detected
              description: HiveWiki collector instance {{ $labels.instance }} has loop errors in the last 10 minutes.

          - alert: CollectorPendingDocumentsHigh
            expr: collector_pending_documents{job="hivewiki-collector"} > 100
            for: 15m
            labels:
              severity: warning
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector pending document backlog is high
              description: HiveWiki collector instance {{ $labels.instance }} has more than 100 pending documents for more than 15 minutes.

          - alert: CollectorDeadDocumentsPresent
            expr: collector_dead_documents{job="hivewiki-collector"} > 0
            for: 10m
            labels:
              severity: warning
              service: hivewiki-collector
              env: dev
            annotations:
              summary: HiveWiki collector dead documents are present
              description: HiveWiki collector instance {{ $labels.instance }} has dead documents for more than 10 minutes.

extraScrapeConfigs: |
  - job_name: yace
    scrape_interval: 15s
    scrape_timeout: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - yace-prometheus-yet-another-cloudwatch-exporter.monitoring.svc.cluster.local:80
  - job_name: karpenter
    scrape_interval: 30s
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - karpenter.karpenter.svc.cluster.local:8080
  - job_name: argocd
    scrape_interval: 30s
    scrape_timeout: 30s
    metrics_path: /metrics
    static_configs:
      - targets:
          - argocd-application-controller-metrics.argocd.svc.cluster.local:8082
          - argocd-repo-server-metrics.argocd.svc.cluster.local:8084
          - argocd-server-metrics.argocd.svc.cluster.local:8083
  - job_name: hivewiki-collector
    scrape_interval: 15s
    scrape_timeout: 5s

    kubernetes_sd_configs:
      - role: endpoints

    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep

      - source_labels: [__meta_kubernetes_namespace]
        regex: hivewiki-collector-dev
        action: keep

      - source_labels: [__meta_kubernetes_service_name]
        regex: hivewiki-collector
        action: keep

      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__

      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

      - source_labels: [__meta_kubernetes_service_name]
        target_label: service

      - source_labels: [__meta_kubernetes_service_label_environment]
        target_label: env

  - job_name: hivewiki-web
    metrics_path: /metrics/
    scrape_interval: 15s
    scrape_timeout: 5s

    kubernetes_sd_configs:
      - role: endpoints

    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        regex: hivewiki-web-dev
        action: keep

      - source_labels: [__meta_kubernetes_service_name]
        regex: hivewiki-web
        action: keep

      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: .*
        action: keep

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

      - source_labels: [__meta_kubernetes_service_name]
        target_label: service
