apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: my-alb-gateway
  namespace: kube-system
spec:
  gatewayClassName: aws-alb-gateway-class
  infrastructure:
    parametersRef:
      kind: LoadBalancerConfiguration
      name: alb-config
      group: gateway.k8s.aws
  listeners:
    - name: http-prod
      protocol: HTTP
      port: 80
      hostname: www.hive-wiki.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hivewiki-web-prod
    - name: https-prod
      protocol: HTTPS
      port: 443
      hostname: www.hive-wiki.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hivewiki-web-prod
    - name: http-dev
      protocol: HTTP
      port: 80
      hostname: test.hive-wiki.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hivewiki-web-dev
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: test.hive-wiki.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: hivewiki-web-dev
    - name: argocd-webhook
      protocol: HTTPS
      port: 443
      hostname: argocd.hive-wiki.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    - name: grafana
      protocol: HTTPS
      port: 443
      hostname: grafana.hive-wiki.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
