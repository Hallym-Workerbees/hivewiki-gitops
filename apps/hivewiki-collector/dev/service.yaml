apiVersion: v1
kind: Service
metadata:
  name: hivewiki-collector
  namespace: hivewiki-collector-dev
  labels:
    app: hivewiki-collector
    app.kubernetes.io/name: hivewiki-collector
    app.kubernetes.io/part-of: hivewiki
    environment: dev
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  selector:
    app: hivewiki-collector
    environment: dev
  ports:
    - name: metrics
      protocol: TCP
      port: 8080
      targetPort: http
