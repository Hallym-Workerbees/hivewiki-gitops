apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: hivewiki-web
  labels:
    environment: prod
spec:
  parentRefs:
    - name: my-alb-gateway
      namespace: kube-system
      sectionName: http-prod
    - name: my-alb-gateway
      namespace: kube-system
      sectionName: https-prod
  hostnames:
    - www.hive-wiki.com
