apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivewiki-builder
  labels:
    environment: dev
spec:
  template:
    metadata:
      labels:
        environment: dev
    spec:
      serviceAccountName: hivewiki-builder-dev
      nodeSelector:
        env: dev
        workload: app
        nodepool: dev
      tolerations:
        - key: env
          operator: Equal
          value: dev
          effect: NoSchedule
      containers:
        - name: hivewiki-builder
          env:
            - name: HOME
              value: /tmp
            - name: USER
              value: app
            - name: LOGNAME
              value: app
            - name: STORM_WORK_DIR
              value: /tmp/hivewiki-builder/storm
            - name: DSP_CACHEDIR
              value: /tmp/hivewiki-builder/dsp-cache
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/hivewiki-builder/torchinductor-cache
            - name: XDG_CACHE_HOME
              value: /tmp/hivewiki-builder/.cache
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
