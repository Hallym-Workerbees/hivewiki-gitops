apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storageclass
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hallym-Workerbees/hivewiki-gitops
    targetRevision: main
    path: infra/storageclass

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
