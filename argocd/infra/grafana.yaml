apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://github.com/Hallym-Workerbees/hivewiki-gitops
      targetRevision: main
      ref: values

    - repoURL: https://github.com/Hallym-Workerbees/hivewiki-gitops
      targetRevision: main
      path: infra/monitoring/grafana/resources

    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 12.3.0
      helm:
        releaseName: grafana
        valueFiles:
          - $values/infra/monitoring/grafana/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
