apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-green-sleepinfos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default

  source:
    repoURL: https://github.com/Hallym-Workerbees/hivewiki-gitops
    targetRevision: main
    path: infra/kube-green/sleepinfos

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-green

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
