apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hivewiki-web-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: hivewiki-web=647502392199.dkr.ecr.ap-northeast-2.amazonaws.com/hivewiki-web
    argocd-image-updater.argoproj.io/hivewiki-web.update-strategy: newest-build
    argocd-image-updater.argoproj.io/hivewiki-web.allow-tags: regexp:^dev-[0-9a-f]{7}$
    argocd-image-updater.argoproj.io/hivewiki-web.kustomize.image-name: 647502392199.dkr.ecr.ap-northeast-2.amazonaws.com/hivewiki-web
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Hallym-Workerbees/hivewiki-gitops
    targetRevision: main
    path: apps/hivewiki-web/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: hivewiki-web-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
