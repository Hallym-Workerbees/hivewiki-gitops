apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hivewiki-collector-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Hallym-Workerbees/hivewiki-gitops
    targetRevision: main
    path: apps/hivewiki-collector/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: hivewiki-collector-prod

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
